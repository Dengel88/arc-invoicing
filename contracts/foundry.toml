[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

solc_version = "0.8.28"
# Arc tracks the Osaka baseline, but this contract needs nothing newer than
# Shanghai. Pinning low removes a whole class of "unsupported opcode on deploy"
# surprises on a chain where a failed deploy costs real USDC.
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
via_ir = false

bytecode_hash = "none"
cbor_metadata = false

gas_reports = ["ArcInvoicing"]
fs_permissions = [{ access = "read", path = "./out" }]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"

[rpc_endpoints]
arc = "${ARC_RPC_URL}"
arc_testnet = "${ARC_TESTNET_RPC_URL}"

[etherscan]
arc = { key = "${ARC_EXPLORER_API_KEY}", url = "${ARC_EXPLORER_VERIFIER_URL}", chain = 5042 }
